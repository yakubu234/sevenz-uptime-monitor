services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: uptime-monitor-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    command: ["sh", "/var/www/html/docker/php/start-app.sh"]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: uptime-monitor-scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    command: ["sh", "/var/www/html/docker/php/start-scheduler.sh"]

  mysql:
    image: mysql:8.4
    container_name: uptime-monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: uptime_monitor
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ularavel", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  vendor_data:
